# =============================================================================
# GitHub feature request issue form template
#
# collects enhancement ideas, problem context, and design alternatives
# ~ نموذج اقتراح ميزات جديدة مع تذكير بقواعد التخصيص في الذاكرة
# =============================================================================

name: Feature Request
description: Suggest an idea or enhancement for Razobill
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please explain your use case and design proposal.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe how you envision this feature working. Please keep our zero-underscore naming convention and zero-heap allocation requirements in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you have considered.
    validations:
      required: false
