# =============================================================================
# Codecov test coverage gate and pull-request reporting configuration
#
# sets precision, project/patch pass thresholds, and path ignore lists
# ~ test coverage reporting and pull request status checks
# =============================================================================

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 50%
        informational: true

ignore:
  - "thirdparty/**/*"
  - "bench/**/*"
  - "tests/**/*"
  - "lib/python/tests/**/*"
  - "docs/**/*"
  - "tools/**/*"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
