# =============================================================================
# GitHub CodeQL static analysis query configuration
#
# excludes vendored third-party code and filters noisy C++ static check queries
# ~ CodeQL configuration ignoring vendored third-party libraries
# =============================================================================

name: "Razobill CodeQL Analysis Configuration"

# Exclude vendored thirdparty libraries from analysis
paths-ignore:
  - "thirdparty/**"

# Filter out false-positive quality and vendor queries
query-filters:
  - exclude:
      id: cpp/unused-static-function
  - exclude:
      id: cpp/poorly-documented-function
  - exclude:
      id: cpp/commented-out-code
