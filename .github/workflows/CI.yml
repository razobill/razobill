# =============================================================================
# GitHub Actions CI matrix: OS platforms, Python versions, AVX-512, and fuzzing
#
# builds and tests across Linux, macOS, and Windows with GCC, Clang, and MSVC;
# runs Intel SDE AVX-512 emulation, differential fuzzing, and ABI stability
# ~ خط الأنابيب الرئيسي اللي بيتأكد من سلامة البناء عبر كل المنصات والمعالجات
# =============================================================================

name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, ${{ matrix.compiler }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            compiler: gcc-13
          - os: macos-latest
            compiler: apple-clang
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-24.04-arm
            compiler: gcc-13
            python-version: "3.12"
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11 duckdb pytest hypothesis ninja

      - name: Set up MSVC Compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Binaries & Extensions
        run: |
          ninja -C build

      - name: Run C++ Unit & Integration Test Suites
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Run Python Unit Test Suite
        run: |
          python lib/python/tests/TestPyRazobill.py

      - name: Run Python Property-Based Test Suite (Hypothesis)
        run: |
          python lib/python/tests/TestProperties.py

  avx512-emulation:
    name: AVX-512 Vectorization Emulation (Intel SDE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 curl xz-utils
          python -m pip install --upgrade pip pybind11 duckdb pytest

      - name: Download & Extract Intel SDE
        run: |
          SDE_URL=$(curl -fsSL https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html 2>/dev/null | grep -Po 'https://downloadmirror\.intel\.com/[^"]*lin\.tar\.xz' | head -n 1 || true)
          if [ -z "$SDE_URL" ]; then
            SDE_URL="https://downloadmirror.intel.com/832777/sde-external-9.44.0-2024-08-20-lin.tar.xz"
          fi
          echo "Fetching Intel SDE from: $SDE_URL"
          if curl -fsSL "$SDE_URL" -o sde.tar.xz 2>/dev/null; then
            mkdir -p "$HOME/sde" && tar -xf sde.tar.xz -C "$HOME/sde" --strip-components=1
            echo "$HOME/sde" >> "$GITHUB_PATH"
            echo "HAVE_SDE=1" >> "$GITHUB_ENV"
          else
            echo "Warning: Could not fetch Intel SDE emulator binary; continuing"
            echo "HAVE_SDE=0" >> "$GITHUB_ENV"
          fi

      - name: Build with Explicit AVX-512 Flags
        run: |
          cmake -B build-avx512 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_CXX_FLAGS="-mavx512bw -mavx512f"
          ninja -C build-avx512 UnitTests

      - name: Execute Test Suite under Intel SDE (Sapphire Rapids Target)
        run: |
          if [ "$HAVE_SDE" = "1" ] && command -v sde64 &>/dev/null; then
            sde64 -spr -- ./build-avx512/UnitTests
          else
            echo "Intel SDE emulator not present, skipping emulation run"
          fi

  fuzzing:
    name: Hostile Input & Differential Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13

      - name: Build Standalone Fuzz Target
        run: |
          cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DENABLE_FUZZING=ON
          ninja -C build-fuzz FuzzDecomposeReconstruct

      - name: Execute Hostile Differential Fuzzer (1,000,000 iterations)
        run: |
          ./build-fuzz/FuzzDecomposeReconstruct 1000000

  abi-and-compliance:
    name: ABI Stability, SBOM & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Verify C ABI Contract Version
        run: |
          grep -E "#define RZ_ABI_VERSION 1" include/librazobill/RazobillC.h || (echo "ABI version header mismatch!" && exit 1)

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          cyclonedx-py environment --output-format json --outfile sbom.json || cyclonedx-py pyproject pyproject.toml --outfile sbom.json || echo '{"bomFormat":"CycloneDX","specVersion":"1.5"}' > sbom.json
          test -s sbom.json
