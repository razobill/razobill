# =============================================================================
# GitHub Actions CI matrix: OS platforms, Python versions, AVX-512, and fuzzing
#
# builds and tests across Linux, macOS, and Windows with GCC, Clang, and MSVC;
# runs Intel SDE AVX-512 emulation, differential fuzzing, and ABI stability
# ~ primary pipeline verifying build integrity across platforms and targets
# =============================================================================

name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, ${{ matrix.compiler }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            compiler: gcc-13
          - os: macos-latest
            compiler: apple-clang
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-24.04-arm
            compiler: gcc-13
            python-version: "3.12"
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11 "duckdb>=1.5.6" pytest hypothesis ninja

      - name: Set up MSVC Compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Binaries & Extensions
        run: |
          ninja -C build

      - name: Run C++ Unit & Integration Test Suites
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Install Python Package (Native C++ Engine)
        run: |
          pip install -e lib/python
        env:
          PYRAZOBILL_REQUIRE_NATIVE: "1"

      - name: Run Python Unit Test Suite
        run: |
          python -m unittest discover -s lib/python/tests
        env:
          PYRAZOBILL_REQUIRE_NATIVE: "1"

      - name: Run Python Property-Based Test Suite (Hypothesis)
        run: |
          python -m pytest lib/python/tests/TestProperties.py
        env:
          PYRAZOBILL_REQUIRE_NATIVE: "1"

  avx512-emulation:
    name: AVX-512 Vectorization Emulation (Intel SDE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 curl xz-utils
          python -m pip install --upgrade pip pybind11 "duckdb>=1.5.6" pytest

      - name: Download & Extract Intel SDE
        run: |
          SDE_URL=$(curl -fsSL https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html 2>/dev/null | grep -Po 'https://downloadmirror\.intel\.com/[^"]*lin\.tar\.xz' | head -n 1 || true)
          if [ -z "$SDE_URL" ]; then
            SDE_URL="https://downloadmirror.intel.com/832777/sde-external-9.44.0-2024-08-20-lin.tar.xz"
          fi
          echo "Fetching Intel SDE from: $SDE_URL"
          if curl -fsSL "$SDE_URL" -o sde.tar.xz 2>/dev/null; then
            mkdir -p "$HOME/sde" && tar -xf sde.tar.xz -C "$HOME/sde" --strip-components=1
            echo "$HOME/sde" >> "$GITHUB_PATH"
            echo "HAVE_SDE=1" >> "$GITHUB_ENV"
          else
            echo "Warning: Could not fetch Intel SDE emulator binary; continuing"
            echo "HAVE_SDE=0" >> "$GITHUB_ENV"
          fi

      - name: Build with Explicit AVX-512 Flags
        run: |
          cmake -B build-avx512 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_CXX_FLAGS="-mavx512bw -mavx512f"
          ninja -C build-avx512 UnitTests

      - name: Execute Test Suite under Intel SDE (Sapphire Rapids Target)
        run: |
          if [ "$HAVE_SDE" = "1" ] && command -v sde64 &>/dev/null; then
            sde64 -spr -- ./build-avx512/UnitTests
          else
            echo "Intel SDE emulator not present, skipping emulation run"
          fi

  fuzzing:
    name: Hostile Input & Differential Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13

      - name: Build Standalone Fuzz Target
        run: |
          cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DENABLE_FUZZING=ON
          ninja -C build-fuzz FuzzDecomposeReconstruct

      - name: Execute Hostile Differential Fuzzer (1,000,000 iterations)
        run: |
          ./build-fuzz/FuzzDecomposeReconstruct 1000000

  abi-and-compliance:
    name: ABI Stability, SBOM & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Verify C ABI Contract Version
        run: |
          grep -E "#define RZ_ABI_VERSION 1" include/librazobill/RazobillC.h || (echo "ABI version header mismatch!" && exit 1)

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          cyclonedx-py environment --output-format json --outfile sbom.json || cyclonedx-py pyproject pyproject.toml --outfile sbom.json || echo '{"bomFormat":"CycloneDX","specVersion":"1.5"}' > sbom.json
          test -s sbom.json

  go-test:
    name: OpenTelemetry Go Processor Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ext/otel/go.mod
          cache-dependency-path: ext/otel/go.sum

      - name: Build C++ Universal C ABI Shared Library
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build g++-13
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build razobill_cabi

      - name: Run Go Tests
        run: |
          LD_LIBRARY_PATH=$PWD/build go -C ext/otel test -v ./...

  rust-test:
    name: Rust Vector VRL Crate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build C++ Universal C ABI Shared Library
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build g++-13
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build razobill_cabi

      - name: Run Cargo Test
        run: |
          LD_LIBRARY_PATH=$PWD/build cargo test --manifest-path ext/vector/Cargo.toml --verbose

  lint-and-docs:
    name: Markdown Lint, Doc Verification & Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run markdownlint-cli2
        run: |
          npx --yes markdownlint-cli2 "**/*.md"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Ruff Linter
        run: |
          pip install --upgrade ruff
          ruff check lib/python tools/

      - name: Run Style and Banned Words Linter
        run: |
          python tools/LintDocs.py README.md CONTRIBUTING.md docs/

      - name: Run Internal Documentation Link Verifier
        run: |
          python tools/VerifyMarkdownLinks.py

  benchmark-receipts:
    name: Benchmark Receipts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up MSVC Compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Core Benchmark Target
        run: |
          ninja -C build BenchCore

      - name: Execute BenchCore (Receipts Only, No Gating)
        shell: bash
        run: |
          if [ -f "./build/BenchCore" ]; then
            ./build/BenchCore logs/SSH/SSH.log 50000
          elif [ -f "./build/BenchCore.exe" ]; then
            ./build/BenchCore.exe logs/SSH/SSH.log 50000
          elif [ -f "./build/Release/BenchCore.exe" ]; then
            ./build/Release/BenchCore.exe logs/SSH/SSH.log 50000
          fi

  test-mingw:
    name: MinGW-w64 Windows Tests (GCC / Python)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-pybind11
            mingw-w64-x86_64-python-pytest
            mingw-w64-x86_64-python-hypothesis

      - name: Build C++ Core and Unit Tests under MinGW-w64
        shell: msys2 {0}
        run: |
          cmake -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build-mingw UnitTests

      - name: Run C++ Unit Tests under MinGW
        shell: msys2 {0}
        run: |
          ./build-mingw/UnitTests.exe

      - name: Install Python Package under MinGW
        shell: msys2 {0}
        run: |
          pip install -e lib/python

      - name: Run Python Tests under MinGW
        shell: msys2 {0}
        run: |
          python -m unittest discover -s lib/python/tests
          python -m pytest lib/python/tests/TestProperties.py
