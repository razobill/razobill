# =============================================================================
# GitHub Actions workflow for DuckDB loadable C extension packaging and tests
#
# builds RazobillDuckdb and executes integration test suite across Linux,
# macOS, and Windows runners
# ~ مسار تجميع إضافة دك دي بي وتشغيل اختبارات التكامل الخاصة بيها
# =============================================================================

name: DuckDB Extension Build & Test

on:
  push:
    paths:
      - "ext/duckdb/**"
      - "include/**"
      - "src/**"
      - "tools/AppendExtensionMetadata.py"
      - "CMakeLists.txt"
      - ".github/workflows/DuckdbExtension.yml"
  pull_request:
    paths:
      - "ext/duckdb/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Build DuckDB Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel duckdb pybind11 ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DuckDB Extension
        run: |
          ninja -C build RazobillDuckdb

      - name: Run Embedded DuckDB Integration Tests
        run: |
          ninja -C build IntegrationDuckdb
          ./build/IntegrationDuckdb || ./build/IntegrationDuckdb.exe
