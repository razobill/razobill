# =============================================================================
# GitHub Actions workflow for DuckDB loadable C extension packaging and tests
#
# builds RazobillDuckdb and executes integration test suite across Linux,
# macOS, and Windows runners
# ~ DuckDB extension build workflow and integration test execution
# =============================================================================

name: DuckDB Extension Build & Test

permissions:
  contents: read

on:
  push:
    paths:
      - "ext/duckdb/**"
      - "include/**"
      - "src/**"
      - "tools/AppendExtensionMetadata.py"
      - "CMakeLists.txt"
      - ".github/workflows/DuckdbExtension.yml"
  pull_request:
    paths:
      - "ext/duckdb/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Build DuckDB Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel "duckdb>=1.5.6" pybind11 ninja

      - name: Install Standalone DuckDB Library (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/libduckdb-linux-amd64.zip
          sudo unzip -q -o /tmp/duckdb.zip libduckdb.so -d /usr/local/lib/
          sudo ldconfig

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DuckDB Extension
        run: |
          ninja -C build RazobillDuckdb

      - name: Run Embedded DuckDB Integration Tests
        run: |
          ninja -C build IntegrationDuckdb
          ./build/IntegrationDuckdb || ./build/IntegrationDuckdb.exe
