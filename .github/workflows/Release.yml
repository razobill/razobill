# =============================================================================
# Release engineering and binary artifact distribution workflow
#
# validates SemVer and Conventional Commits, builds multi-platform DuckDB
# extensions and Python wheels, generates provenance attestations, and publishes
# =============================================================================

name: Release Engineering & Binary Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      versionBump:
        description: 'SemVer release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-and-lint:
    name: Lint Commits & Verify ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Verifying release commit message:"
          echo "${MSG}"
          if [[ ! "${MSG}" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: ]]; then
            echo "::error::Commit message does not match Conventional Commits format"
            exit 1
          fi
          echo "Commit message adheres to Conventional Commits specification."

      - name: Validate SemVer Invariant
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Building librazobill version: ${VERSION}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

  build-matrix:
    name: Build & Test (${{ matrix.os }})
    needs: validate-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1 setuptools==75.6.0 wheel==0.45.1 pybind11==2.13.6 duckdb==1.1.3 pytest==8.3.4 ninja==1.11.1.1

      - name: Set up C++20 Compiler
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Libraries & Extensions
        run: cmake --build build --config Release

      - name: Run Test Suites
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run Python Verification Suite
        run: python lib/python/tests/TestPyRazobill.py

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p release-staging
          find build -maxdepth 1 -name "*.duckdb_extension" -exec cp {} release-staging/ \;
          find lib/python/pyrazobill -maxdepth 1 -name "Core*" -exec cp {} release-staging/ \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.os }}
          path: release-staging/*
          if-no-files-found: ignore

  build-wheels-windows:
    name: Build Windows Wheel (cp${{ matrix.python-version }})
    needs: validate-and-lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Wheel
        run: |
          python -m pip install --upgrade pip==24.3.1 setuptools==75.6.0 wheel==0.45.1 pybind11==2.13.6 build==1.2.2.post1
          python -m build --wheel
        env:
          PYRAZOBILL_REQUIRE_NATIVE: "1"
        working-directory: lib/python
      - name: Smoke Test Windows Wheel
        shell: pwsh
        run: |
          $wheel = Get-Item lib/python/dist/*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          python -c "import pyrazobill as rz; assert rz.isNative(); assert rz.split('test 123')"
      - name: Upload Windows Wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-cp${{ matrix.python-version }}
          path: lib/python/dist/*.whl

  build-wheels-linux:
    name: Build Linux Wheels (manylinux x86_64 / aarch64)
    needs: validate-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Stage Core Sources and Headers
        run: |
          cp -r src lib/python/srcCore
          cp -r include lib/python/includeCore
          mkdir -p lib/python/thirdpartyCore
          cp -r thirdparty/adbc lib/python/thirdpartyCore/adbc
          cp -r thirdparty/duckdbcapi lib/python/thirdpartyCore/duckdbcapi
      - name: Set up QEMU for aarch64 Emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0
      - name: Build manylinux Wheels
        run: python -m cibuildwheel --output-dir wheelhouse lib/python
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_ENVIRONMENT: 'PYRAZOBILL_REQUIRE_NATIVE="1"'
          CIBW_TEST_COMMAND: 'python -c "import pyrazobill as rz; assert rz.isNative(); assert rz.split(\"test 123\")"'
      - name: Upload Linux Wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build-wheels-macos:
    name: Build macOS Wheel (cp${{ matrix.python-version }})
    needs: validate-and-lint
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build macOS Wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          PYRAZOBILL_REQUIRE_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip==24.3.1 setuptools==75.6.0 wheel==0.45.1 pybind11==2.13.6 build==1.2.2.post1
          python -m build --wheel
        working-directory: lib/python
      - name: Smoke Test macOS Wheel
        run: |
          python -m pip install lib/python/dist/*.whl
          python -c "import pyrazobill as rz; assert rz.isNative(); assert rz.split('test 123')"
      - name: Upload macOS Wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-cp${{ matrix.python-version }}
          path: lib/python/dist/*.whl

  publish-release:
    name: Sign & Publish GitHub Release
    needs: [build-matrix, build-wheels-windows, build-wheels-linux, build-wheels-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-binaries
          sha256sum * > SHA256SUMS
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: librazobill v${{ steps.get_version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-binaries/*

  publish-pypi:
    name: Build & Publish to PyPI
    needs: [build-matrix, build-wheels-windows, build-wheels-linux, build-wheels-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download Pre-built Wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: lib/python/dist
          merge-multiple: true

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1 build==1.2.2.post1 twine==6.0.1 setuptools==75.6.0 wheel==0.45.1 pybind11==2.13.6

      - name: Stage Core Sources and Headers
        run: |
          cp -r src lib/python/srcCore
          cp -r include lib/python/includeCore
          mkdir -p lib/python/thirdpartyCore
          cp -r thirdparty/adbc lib/python/thirdpartyCore/adbc
          cp -r thirdparty/duckdbcapi lib/python/thirdpartyCore/duckdbcapi

      - name: Build Source Distribution
        working-directory: lib/python
        run: |
          python -m build --sdist

      - name: Verify Package with Twine
        working-directory: lib/python
        run: |
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: lib/python
        run: |
          twine upload dist/* --skip-existing
