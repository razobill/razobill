# =============================================================================
# GitHub Actions CodeQL security and vulnerability analysis workflow
#
# analyzes C++ and Python sources for vulnerabilities and security hot-spots
# ~ periodic security scans for C++ and Python sources
# =============================================================================

name: CodeQL Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["c-cpp", "python"]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python & Build Tools
        run: |
          python -m pip install --upgrade pip pybind11 ninja
          sudo apt-get update && sudo apt-get install -y ninja-build libduckdb-dev || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config-file: .github/codeql/codeql-config.yml
          build-mode: ${{ matrix.language == 'c-cpp' && 'manual' || 'none' }}

      - name: Build C++ Codebase for CodeQL Tracing
        if: matrix.language == 'c-cpp'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
