# =============================================================================
# GitHub Actions test coverage measurement and Codecov upload workflow
#
# compiles with gcov/lcov instrumentation for C++ and pytest-cov for Python
# ~ test coverage measurement for C++ and Python with report upload
# =============================================================================

name: Code Coverage

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage (C++ & Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Coverage Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lcov curl unzip
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/libduckdb-linux-amd64.zip
          sudo unzip -q -o /tmp/duckdb.zip libduckdb.so -d /usr/local/lib/
          sudo ldconfig
          python -m pip install --upgrade pip pybind11 duckdb pytest pytest-cov hypothesis codecov-cli

      - name: Configure CMake with Coverage Instrumentation
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON

      - name: Build C++ Binaries & Test Suites
        run: |
          ninja -C build

      - name: Fetch Test Corpus
        run: |
          python tools/FetchLogHubCorpus.py build/corpus.parquet

      - name: Run C++ Unit & Integration Tests
        run: |
          export RZB_CORPUS_PARQUET="build/corpus.parquet"
          ctest --test-dir build --output-on-failure -C Debug

      - name: Collect C++ LCOV Coverage Report
        run: |
          lcov --capture --directory build --output-file coverage_cpp.info \
            --ignore-errors mismatch,unused \
            --exclude '*/thirdparty/*' \
            --exclude '/usr/*' \
            --exclude '*/tests/*' \
            --exclude '*/bench/*' || true

      - name: Run Python Test Suite with Pytest Coverage
        run: |
          python -m pytest lib/python/tests -c lib/python/pyproject.toml \
            --cov=lib/python/pyrazobill \
            --cov-report=xml:coverage_py.xml

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage_cpp.info,coverage_py.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
