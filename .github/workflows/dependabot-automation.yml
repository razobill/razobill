# =============================================================================
# GitHub Actions automated triage and metadata inspection for Dependabot PRs
#
# inspects SemVer update metadata and validates minor and patch updates
# ~ automated verification and triage for Dependabot pull requests
# =============================================================================

name: Dependabot Automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    name: Review & Validate Metadata
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Validate & Comment SemVer Minor & Patch Updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "Dependabot metadata validation passed for minor/patch update."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
