# =============================================================================
# GitHub Actions documentation style and link verification workflow
#
# verifies documentation files against style guide, banned terms, and links
# ~ documentation quality checks, relative link validation, and style linting
# =============================================================================

name: Documentation Lint

permissions:
  contents: read

on:
  push:
    branches: [main, docs/identity-refactor]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'tools/LintDocs.py'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'tools/LintDocs.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Run documentation style and structure linter
        run: |
          python tools/LintDocs.py README.md CONTRIBUTING.md docs/
