# =============================================================================
# Continuous Coverage-Guided libFuzzer Pipeline (Clang, ASan, UBSan)
#
# runs LLVM libFuzzer with AddressSanitizer and UndefinedBehaviorSanitizer
# against hostile and mutated inputs using domain dictionaries and seed corpus
# =============================================================================

name: Continuous libFuzzer

permissions:
  contents: read

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzzing duration in seconds"
        required: false
        default: "600"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libfuzzer:
    name: libFuzzer Coverage-Guided Fuzzing (Clang, ASan, UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Build Tools & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm

      - name: Run libFuzzer Harness
        run: |
          python tools/RunLibFuzzer.py --duration ${{ github.event.inputs.duration || '600' }}

      - name: Upload Corpus Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: tests/fuzz/corpus/
          if-no-files-found: ignore
