# =============================================================================
# GitHub Pages Astro static site and documentation deployment workflow
#
# builds web/ with Astro 7, renders Mermaid diagrams, generates Pagefind index,
# and publishes web/dist to GitHub Pages environment
# =============================================================================

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["web/**", "docs/**", "VERSION", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**", "docs/**", "VERSION", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium (renders Mermaid diagrams at build time)
        run: npx playwright install --with-deps chromium
      - name: Build site and search index
        run: npm run build
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
