# ==============================================================================
# OpenTelemetry Collector Builder (ocb) manifest for razobill
#
# compiles custom collector binary (otelcol-razobill) embedding the razobill
# log compaction processor alongside standard receivers, batchers, and exporters
# ==============================================================================

# distribution metadata and target collector core version
dist:
  name: otelcol-razobill
  description: "Custom OpenTelemetry Collector with embedded librazobill log compaction"
  output_path: ./dist
  otelcol_version: 0.111.0

# processor pipeline components including local razobill log processor
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.111.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.111.0
  - gomod: github.com/razobill/razobill/ext/otel v1.1.5
    path: ./ext/otel

# incoming telemetry receivers: file log tailing and OTLP gRPC/HTTP
receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.111.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.111.0

# telemetry exporters: OTLP, stdout debug, AWS S3, and ClickHouse
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.111.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.111.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/awss3exporter v0.111.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.111.0
