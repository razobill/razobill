# ==============================================================================
# Vector VRL transform crate manifest (Cargo.toml)
#
# compiles native Vector Remap Language (VRL) transform crate wrapping the
# librazobill Universal C ABI
# ==============================================================================

[package]
name = "razobill-vector"
version = "1.0.0"
edition = "2021"
authors = ["Razobill Contributors"]
description = "Vector Remap Language (VRL) native transform wrapping librazobill Universal C ABI"
license = "Apache-2.0"

[lib]
name = "razobill_vector"
path = "RazobillVrl.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
# serialization for vector event payload payloads
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
