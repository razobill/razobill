# =============================================================================
# Vector edge pipeline configuration for razobill log decomposition
#
# ingests kubernetes container logs, executes parse_razobill in-flight VRL
# transform, and fans out structured columns to s3 parquet and clickhouse
# =============================================================================

# input source: tail active container log files from kubernetes node storage
sources:
  kubernetes_logs:
    type: file
    include:
      - /var/log/containers/*.log
    read_from: beginning

# stream transform: invoke librazobill native remap transform on raw log line
transforms:
  razobill_decompose:
    type: remap
    inputs:
      - kubernetes_logs
    source: |
      # Calls native librazobill C ABI transform
      .razobill = parse_razobill!(.message)

      # Retain template as the primary message skeleton
      .message = .razobill.template
      .ints = .razobill.ints
      .strs = .razobill.strs

# downstream destinations: columnar analytics storage with dual target fanout
sinks:
  # cold analytics archive: columnar parquet files compressed with zstd
  aws_s3_parquet:
    type: aws_s3
    inputs:
      - razobill_decompose
    bucket: telemetry
    key_prefix: "year=%Y/month=%m/day=%d/"
    encoding:
      codec: parquet
    compression: zstd

  # hot query engine: direct clickhouse ingest into compact schema table
  clickhouse_cluster:
    type: clickhouse
    inputs:
      - razobill_decompose
    endpoint: "http://clickhouse:8123"
    database: "telemetry"
    table: "logs_compact"
    skip_unknown_fields: true
