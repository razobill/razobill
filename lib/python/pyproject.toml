# ==============================================================================
# pyrazobill python packaging configuration (PEP 517 / PEP 621)
#
# specifies build dependencies (setuptools, pybind11, wheel), package metadata,
# pytest configuration, and package data inclusion rules
# ==============================================================================

[build-system]
requires = ["setuptools>=65.0.0", "pybind11>=3.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrazobill"
version = "1.1.8"
description = "High-performance log parsing, exact lossless compaction, and information-theoretic semantic accounting library"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "M. M. Atta and Razobill Contributors" }
]
keywords = [
    "log-parsing",
    "information-theory",
    "compression",
    "duckdb",
    "lossless",
    "drain",
    "high-performance",
    "cpp20"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/razobill/razobill"
Documentation = "https://github.com/razobill/razobill/blob/main/docs/README.md"
Repository = "https://github.com/razobill/razobill.git"
Issues = "https://github.com/razobill/razobill/issues"
Changelog = "https://github.com/razobill/razobill/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# development, testing, and property-based fuzzing dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.90.0",
    "psutil>=5.9.0",
    "duckdb>=2.0.0"
]

[tool.pytest.ini_options]
# test discovery patterns matching unit and property test suites
python_files = ["Test*.py", "test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrazobill*"]

[tool.setuptools.package-data]
# include type stubs (py.typed, Core.pyi) and compiled extension binaries
pyrazobill = ["py.typed", "*.pyi", "*.pyd", "*.so", "*.dll"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* pp*"
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
