# =============================================================================
# root repository Ruff linter and formatter configuration
#
# configures Python style rules, max line length, and benchmark ignore rules
# ~ configures Ruff linter and formatter rules for repository Python code
# =============================================================================

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "extension-ci-tools",
    "thirdparty",
    "build",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # Module level import not at top of file:
    # standalone bench/test scripts inject local package to sys.path
    "E402",
    # Line too long: handled by ruff format; table printing in bench preserved
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
